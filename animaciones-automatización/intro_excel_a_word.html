<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro · De un Excel a 127 informes en Word</title>
<style>
:root{
  --t-fast:260ms; --t-mid:520ms; --t-slow:900ms; --t-zoom:1150ms;
  --in:cubic-bezier(.22,.61,.36,1);
  --out:cubic-bezier(.55,.06,.68,.19);
  --pop:cubic-bezier(.3,1.35,.5,1);
}
html,body{margin:0;height:100%;background:#F2F4F7;overflow:hidden;cursor:pointer;
  -webkit-user-select:none;user-select:none}
svg{display:block;width:100vw;height:100vh}
text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.mono{font-family:"Consolas","SF Mono",Menlo,monospace}
.serif{font-family:Georgia,"Cambria","Times New Roman",serif}

/* Los grupos grandes se promueven a su propia capa: la grabación de pantalla
   necesita 60 fps estables con 48 documentos animándose a la vez. */
.sheet,.pyblock,.docsgrid,.herodoc,.xcard,.rowchip{will-change:transform,opacity}

/* ── Motor de estados: pre (sin clase) → .in → .out ───────────────────────── */

.sheet{opacity:0;transform:translateY(26px) scale(.985);transform-origin:620px 450px;
  transition:opacity var(--t-mid) ease, transform var(--t-slow) var(--in)}
.sheet.in{opacity:1;transform:none}
.sheet.out{opacity:0;transform:translate(-370px,5px) scale(.31);
  transition:opacity var(--t-slow) var(--out), transform var(--t-slow) var(--out)}
.sheet.dim:not(.out){opacity:.4}

.row{opacity:0;transform:translateX(-34px);
  transition:opacity var(--t-fast) ease, transform 420ms var(--in)}
.row.in{opacity:1;transform:none}
.row.mute{opacity:.2}

.sfoot,.rowhl{opacity:0;transition:opacity var(--t-mid) ease}
.sfoot.in,.rowhl.in{opacity:1}

.hook,.hookline,.hook2{opacity:0;transform:translateY(16px);
  transition:opacity var(--t-mid) ease, transform var(--t-mid) var(--in)}
.hook.in,.hookline.in,.hook2.in{opacity:1;transform:none}
.hook.out,.hookline.out,.hook2.out{opacity:0;transform:translateY(-12px);
  transition-duration:var(--t-fast)}
.strike{transform:none;stroke-dasharray:100;stroke-dashoffset:100;
  transition:stroke-dashoffset var(--t-mid) var(--in), opacity var(--t-fast) ease}
.strike.in{stroke-dashoffset:0}

.xcard,.rowchip,.herodoc,.pyblock{opacity:0;transform:translateY(16px);
  transition:opacity var(--t-mid) ease, transform var(--t-mid) var(--in)}
.xcard.in,.rowchip.in,.herodoc.in,.pyblock.in{opacity:1;transform:none}
.xcard.out,.rowchip.out,.pyblock.out{opacity:0;transform:translateY(-12px);
  transition-duration:var(--t-fast)}
/* El informe hero no se desvanece en el vacío: se encoge hacia la rejilla,
   que es literalmente lo que va a pasar 127 veces. */
.herodoc{transform-origin:1235px 465px}
.herodoc.out{opacity:0;transform:translate(86px,-19px) scale(.3);
  transition:opacity var(--t-slow) var(--out), transform var(--t-slow) var(--out)}

.conn{stroke-dasharray:100;stroke-dashoffset:100;
  transition:stroke-dashoffset var(--t-mid) var(--in), opacity var(--t-fast) ease}
.conn.in{stroke-dashoffset:0}
.conn.out{opacity:0}
.cdot{opacity:0;transition:opacity var(--t-fast) ease}
.cdot.in{opacity:1}
.cdot.out{opacity:0}

.ph{opacity:1;transition:opacity var(--t-fast) ease}
.ph.out{opacity:0}
.val,.docextra{opacity:0;transition:opacity var(--t-mid) ease}
.val.in,.docextra.in{opacity:1}
.flashrect{opacity:0}
.flash .flashrect{animation:flashOut 900ms ease both}
@keyframes flashOut{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

.cl,.stagelbl{opacity:0;transform:translateX(-16px);
  transition:opacity var(--t-fast) ease, transform 300ms var(--in)}
.cl.in,.stagelbl.in{opacity:1;transform:none}
.stagelbl{transform:translateY(12px)}

/* Cabecera: entra bajando desde arriba y se retira en el cierre para no
   competir con el titular grande. El subrayado se dibuja con la misma técnica
   que .conn y .strike: pathLength 100 + stroke-dashoffset de 100 a 0. */
.ptitle{opacity:0;transform:translateY(-12px);
  transition:opacity var(--t-slow) ease, transform var(--t-slow) var(--in)}
.ptitle.in{opacity:1;transform:none}
.ptitle.out{opacity:0;transform:translateY(-12px);transition-duration:var(--t-mid)}
.ptrule{stroke-dasharray:100;stroke-dashoffset:100;
  transition:stroke-dashoffset var(--t-slow) var(--in), opacity var(--t-mid) ease}
.ptrule.in{stroke-dashoffset:0}

/* Logos que no viven dentro de una tarjeta y necesitan su propia entrada */
.logo{opacity:0;transform:translateY(10px);
  transition:opacity var(--t-mid) ease, transform var(--t-mid) var(--in)}
.logo.in{opacity:1;transform:none}
.logo.out{opacity:0;transform:translateY(-10px);transition-duration:var(--t-fast)}

.runui,.counter{opacity:0;transition:opacity var(--t-fast) ease}
.runui.in,.counter.in{opacity:1}
.counter.out{opacity:0}
/* scaleX en vez de animar `width`: no depende de propiedades de geometría CSS
   y se compone en GPU. */
.prog{transform:scaleX(0);transform-origin:502px 583px;
  transition:transform 2400ms cubic-bezier(.35,.05,.25,1)}
.prog.in{transform:scaleX(1)}
#counter{transform-origin:1321px 634px;transition:transform 340ms var(--pop)}
#counter.pop{transform:scale(1.1)}
.chk{opacity:0;transition:opacity var(--t-fast) ease}
.chk.on{opacity:1}

.flow{opacity:0;transition:opacity var(--t-fast) ease}
.flow.in{opacity:1}
.flow.out{opacity:0}
.pa{animation:laneA 1.5s linear infinite}
@keyframes laneA{0%{transform:translateX(0);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(52px);opacity:0}}
.pb{animation:laneB 1.6s linear infinite}
@keyframes laneB{0%{transform:translateX(0);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(94px);opacity:0}}

.docsgrid{opacity:0;transform-origin:1321px 446px;
  transition:opacity var(--t-fast) ease, transform var(--t-zoom) var(--in)}
.docsgrid.in{opacity:1}
.docsgrid.zoom{transform:translate(-521px,-96px) scale(1.42)}

.doc{opacity:0;transform:scale(.3);
  transition:opacity 240ms ease, transform 320ms var(--pop)}
.doc.in{opacity:1;transform:none}

.otitle,.osub,.brand{opacity:0;transform:translateY(22px);
  transition:opacity var(--t-slow) ease, transform var(--t-slow) var(--in)}
.otitle.in,.osub.in,.brand.in{opacity:1;transform:none}

/* ── HUD: se puede ocultar con H o ?hud=0 para que no quede en la grabación ─ */
.dot{fill:#7C8AA0;opacity:.16;transition:opacity var(--t-fast) ease, fill var(--t-fast) ease}
.dot.done{opacity:.30}
.dot.on{fill:#2B6CB0;opacity:.60}
#hint{opacity:0;transition:opacity var(--t-mid) ease}
#hint.show{opacity:1}

/* Botón de salida de pantalla completa. Aparece al mover el ratón y se apaga
   solo a los 2,6 s: no estorba en una grabación, pero siempre queda una forma
   de volver que no depende de que el teclado llegue a la página. */
#fsexit{position:fixed;top:18px;right:18px;z-index:10;opacity:0;pointer-events:none;
  transition:opacity .3s ease;
  font:600 14px/1 "Segoe UI",system-ui,-apple-system,sans-serif;color:#fff;
  background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:11px 18px;cursor:pointer}
#fsexit:hover{background:rgba(15,23,42,.95)}
.isfs.fsui #fsexit{opacity:1;pointer-events:auto}

/* Vuelta al índice de ejercicios. Se va con el HUD (H o ?hud=0) y en pantalla
   completa, para que tampoco quede en la grabación. */
#home{position:fixed;top:18px;left:18px;z-index:10;opacity:.6;
  transition:opacity .3s ease, background .3s ease;
  font:600 14px/1 "Segoe UI",system-ui,-apple-system,sans-serif;color:#334155;
  background:rgba(255,255,255,.72);border:1px solid rgba(15,23,42,.14);
  border-radius:999px;padding:11px 18px;cursor:pointer;text-decoration:none}
#home:hover,#home:focus-visible{opacity:1;background:#fff}
.isfs #home{display:none}

/* Salto instantáneo al reiniciar */
.instant *{transition-duration:0s !important;transition-delay:0s !important}
</style>
</head>

<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Una base de datos de nómina en Excel procesada por un script de Python que genera 127 informes en Word con formato profesional">

  </filter>

  </g>

      <rect x="4" y="3" width="20" height="25" rx="6"/>

    <g fill="#FFD343">

</defs>

<script>
(function(){
"use strict";

/* Cada paso declara qué entra y qué sale. El avance es por clic: no hay reloj
   global, así que se puede ir hacia atrás y el estado se recompone solo.

   El arco narrativo va de lo particular a lo masivo: primero UNA fila se
   convierte en UN informe formateado (pasos 4-7), y solo entonces se muestra
   que eso ocurre 127 veces (pasos 8-9). */
var STEPS = [
  { enter:['.ptitle','.ptrule','.sheet','.logoXlSheet'] },                         // 0 · la hoja
  { enter:['.row','.sfoot'] },                                                     // 1 · las filas
  { enter:['.hook','.hookline'] },                                                 // 2 · ≈ 17 horas
  { enter:['.hook2'] },                                                            // 3 · 12 segundos
  { enter:['.rowhl'], exit:['.hook','.hookline','.hook2'] },                       // 4 · una fila
  { enter:['.xcard','.rowchip','.herodoc'],
    exit:['.sheet','.logoXlSheet'] },                                              // 5 · la plantilla
  { enter:['.conn','.cdot'] },                                                     // 6 · columna → campo
  { enter:['.val','.docextra'], exit:['.ph'] },                                    // 7 · el informe
  { enter:['.pyblock','.cl','.stagelbl','.flow','.docsgrid','.logoWordGrid'],
    exit:['.rowchip','.conn','.cdot','.herodoc'] },                                // 8 · el script
  { enter:['.runui','.prog','.doc','.counter'] },                                  // 9 · ejecución
  { enter:['.otitle'],
    exit:['.pyblock','.flow','.xcard','.stagelbl','.counter','.logoWordGrid',
          '.ptitle','.ptrule'] },                                                  // 10 · el resultado
  { enter:['.osub','.brand'] }                                                     // 11 · cierre
];
var ZOOM_AT = 10;   // paso en el que la rejilla se acerca y se centra
var RUN_AT  = 9;    // paso que dispara el contador

/* ── Preparación ──────────────────────────────────────────────────────────── */
var plan = new Map();   // elemento → {inAt, outAt}
function mark(sel, i, key){
  document.querySelectorAll(sel).forEach(function(el){
    var rec = plan.get(el) || {};
    if(rec[key] === undefined) rec[key] = i;
    plan.set(el, rec);
  });
}
STEPS.forEach(function(s, i){
  (s.enter||[]).forEach(function(sel){ mark(sel, i, 'inAt'); });
  (s.exit ||[]).forEach(function(sel){ mark(sel, i, 'outAt'); });
});
// Los marcadores {{campo}} nacen visibles y solo tienen salida.
document.querySelectorAll('.ph').forEach(function(el){
  var rec = plan.get(el) || {}; rec.inAt = 5; plan.set(el, rec);
});

function stagger(sel, step){
  document.querySelectorAll(sel).forEach(function(el, i){ el.dataset.delay = (i*step).toFixed(3); });
}
function fixedDelay(sel, d){
  document.querySelectorAll(sel).forEach(function(el){ el.dataset.delay = d; });
}
stagger('.row',      .065);
stagger('.cl',       .085);
stagger('.doc',      .045);
stagger('.hookline', .13);
stagger('.hook2',    .18);
stagger('.conn',     .14);
stagger('.stagelbl', .1);
stagger('.docextra', .075);
fixedDelay('.ptrule',  .35);   // la línea se dibuja cuando el título ya entró
fixedDelay('.rowchip', .1);
fixedDelay('.herodoc', .2);
fixedDelay('.pyblock', .12);
// Los puntos de los conectores aparecen justo después de que la línea llega.
document.querySelectorAll('.cdot').forEach(function(el, i){
  el.dataset.delay = (0.14 * (i % 3) + (i < 3 ? 0 : 0.42)).toFixed(3);
});

/* Origen de escala de cada documento, calculado desde sus propias x/y */
document.querySelectorAll('.doc').forEach(function(u){
  var x = +u.getAttribute('x'), y = +u.getAttribute('y');
  u.style.transformOrigin = (x+17)+'px '+(y+21)+'px';
});

/* Puntos de progreso del HUD */
var hud = document.getElementById('hud');
var hint = document.getElementById('hint');
var SVGNS = 'http://www.w3.org/2000/svg';
var dots = STEPS.map(function(_, i){
  var c = document.createElementNS(SVGNS,'circle');
  c.setAttribute('cx', 1347 + i*13);
  c.setAttribute('cy', 862);
  c.setAttribute('r', 2.5);
  c.setAttribute('class','dot');
  hud.appendChild(c);
  return c;
});

var hudOn = new URLSearchParams(location.search).get('hud') !== '0';
function applyHud(){
  hud.style.display = hudOn ? '' : 'none';
  document.getElementById('home').style.display = hudOn ? '' : 'none';
  updateHint();
}
applyHud();

/* ── Contador de informes ─────────────────────────────────────────────────── */
var counter  = document.getElementById('counter');
var runlabel = document.getElementById('runlabel');
var chk      = document.querySelector('.chk');
var countRAF = null, popTO = null;

function runCounter(){
  cancelAnimationFrame(countRAF);
  clearTimeout(popTO);
  var dur = 2400, t0 = performance.now();
  runlabel.textContent = 'generando informes…';
  counter.setAttribute('fill','#0F172A');
  chk.classList.remove('on');
  (function tick(now){
    var p = Math.min(1, (now - t0) / dur);
    var e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;   // acompaña la barra
    counter.textContent = Math.round(e*127) + ' / 127';
    if(p < 1){ countRAF = requestAnimationFrame(tick); return; }
    counter.setAttribute('fill','#1E7B4D');
    runlabel.textContent = 'informes generados';
    chk.classList.add('on');
    counter.classList.add('pop');
    popTO = setTimeout(function(){ counter.classList.remove('pop'); }, 340);
  })(t0);
}
function resetCounter(){
  cancelAnimationFrame(countRAF);
  clearTimeout(popTO);
  counter.textContent = '0 / 127';
  counter.setAttribute('fill','#0F172A');
  counter.classList.remove('pop');
  chk.classList.remove('on');
  runlabel.textContent = 'generando informes…';
}

/* ── Render ───────────────────────────────────────────────────────────────── */
var beat = -1;
var grid  = document.querySelector('.docsgrid');
var sheet = document.querySelector('.sheet');
var hero  = document.querySelector('.herodoc');
var rows  = document.querySelectorAll('.row');

function render(){
  plan.forEach(function(rec, el){
    var state = 'pre';
    if(rec.outAt !== undefined && beat >= rec.outAt) state = 'out';
    else if(rec.inAt !== undefined && beat >= rec.inAt) state = 'in';
    el.classList.toggle('in',  state === 'in');
    el.classList.toggle('out', state === 'out');
    // El escalonado solo cuenta al entrar; al retroceder todo se va a la vez.
    el.style.transitionDelay = (state === 'in' && el.dataset.delay) ? el.dataset.delay+'s' : '0s';
  });

  grid.classList.toggle('zoom', beat >= ZOOM_AT);
  sheet.classList.toggle('dim', beat === 2 || beat === 3);
  hero.classList.toggle('flash', beat === 7);
  rows.forEach(function(r, i){ r.classList.toggle('mute', beat >= 4 && i !== 0); });

  dots.forEach(function(d, i){
    d.classList.toggle('on', i === beat);
    d.classList.toggle('done', i < beat);
  });

  updateHint();
}

function goTo(n){
  n = Math.max(0, Math.min(STEPS.length - 1, n));
  if(n === beat) return;
  var prev = beat;
  beat = n;
  if(beat >= RUN_AT && prev <  RUN_AT) runCounter();
  if(beat <  RUN_AT && prev >= RUN_AT) resetCounter();
  render();
}

var next = function(){ goTo(beat + 1); };
var prev = function(){ goTo(beat - 1); };

/* Fuerza al navegador a recalcular estilos ahora mismo. Sin esto, pasar de
   'pre' a '.in' en el mismo frame no dispara ninguna transición; con esto, no
   hace falta requestAnimationFrame (que no llega si la pestaña no está
   pintando, y dejaría la pantalla en blanco a mitad de una presentación). */
function flush(){ void document.body.offsetHeight; }

function reset(){
  // Desmonta sin animar y deja el lienzo vacío, igual que al abrir el archivo:
  // el siguiente clic vuelve a arrancar la animación desde cero.
  var root = document.documentElement;
  root.classList.add('instant');
  resetCounter();
  beat = -1;
  render();
  flush();
  root.classList.remove('instant');
  flush();
}

/* ── Pantalla completa ────────────────────────────────────────────────────── */
/* Se entra y se sale con F, y también se sale con Esc. Mientras dura, la pista
   de abajo recuerda la tecla: en pantalla completa no queda ningún elemento del
   navegador que lo indique, y ahí es donde uno se siente atrapado. */
function fsElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}
function exitFs(){
  var fn = document.exitFullscreen || document.webkitExitFullscreen;
  if(!fn) return;
  // Sin comprobar el estado antes: si no había pantalla completa, la promesa
  // se rechaza y la capturamos. Así nunca dejamos de intentar salir.
  try { var p = fn.call(document); if(p && p.catch) p.catch(function(){}); } catch(err){}
}
function enterFs(){
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!fn) return;
  try {
    var p = fn.call(el);
    if(p && p.catch) p.catch(function(){});   // si el navegador la rechaza, no rompemos nada
  } catch(err){}
}
function toggleFs(){ if(fsElement()) exitFs(); else enterFs(); }

/* El botón es la garantía: un clic siempre llega, aunque las teclas no. */
var fsBtn = document.getElementById('fsexit');
fsBtn.addEventListener('click', function(e){
  e.stopPropagation();   // sale de pantalla completa; no avanza la animación
  exitFs();
});

var uiTO = null;
function showFsUi(){
  if(!fsElement()) return;
  document.documentElement.classList.add('fsui');
  clearTimeout(uiTO);
  uiTO = setTimeout(function(){ document.documentElement.classList.remove('fsui'); }, 2600);
}
window.addEventListener('mousemove', showFsUi);

document.addEventListener('fullscreenchange', updateHint);
document.addEventListener('webkitfullscreenchange', updateHint);

function updateHint(){
  var fs = !!fsElement();
  document.documentElement.classList.toggle('isfs', fs);
  if(fs) showFsUi();

  hint.style.display = hudOn ? '' : 'none';
  if(fs){
    hint.textContent = 'F, Esc o el botón para salir de pantalla completa';
    hint.classList.add('show');
    return;
  }

  // beat -1 es el lienzo vacío previo al primer clic, y también necesita pista.
  if(beat <= 0)                      { hint.textContent = 'clic o → para avanzar · I vuelve al inicio · H oculta esta guía'; hint.classList.add('show'); }
  else if(beat === STEPS.length - 1) { hint.textContent = 'R para reiniciar'; hint.classList.add('show'); }
  else                               { hint.classList.remove('show'); }
}

/* ── Controles ────────────────────────────────────────────────────────────── */
document.getElementById('home').addEventListener('click', function(e){
  e.stopPropagation();   // vuelve al índice; no avanza la animación
});
window.addEventListener('click', next);
window.addEventListener('contextmenu', function(e){ e.preventDefault(); prev(); });

window.addEventListener('keydown', function(e){
  var k = e.key;
  if(k === ' ' || k === 'Enter' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown'){
    e.preventDefault(); next();
  } else if(k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace'){
    e.preventDefault(); prev();
  } else if(k === 'Home' || k === 'r' || k === 'R'){
    e.preventDefault(); reset();
  } else if(k === 'h' || k === 'H'){
    e.preventDefault(); hudOn = !hudOn; applyHud();
  } else if(k === 'Escape'){
    /* Sin preventDefault: además de lo nuestro, el navegador debe seguir
       haciendo lo suyo. Se maneja explícitamente como red de seguridad. */
    exitFs();
  } else if((k === 'i' || k === 'I') && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault(); location.href = 'index.html';
  } else if(k === 'f' || k === 'F'){
    e.preventDefault(); toggleFs();
  }
}, true);   // fase de captura: nuestro manejador es el primero de la cadena

/* Arranca en el lienzo vacío (beat -1): el primer clic es el que trae la
   primera tarjeta. Así se puede empezar a grabar sobre una pantalla limpia y
   la entrada queda sincronizada con la narración. El flush deja pintado el
   estado 'pre' para que esa primera transición se vea completa. */
render();
flush();
})();
</script>
</body>
</html>
