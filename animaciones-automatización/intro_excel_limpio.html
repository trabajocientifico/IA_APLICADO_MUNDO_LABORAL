<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro · De un Excel sucio a un Excel vivo</title>
<style>
:root{
  --t-fast:260ms; --t-mid:520ms; --t-slow:900ms; --t-zoom:1150ms;
  --in:cubic-bezier(.22,.61,.36,1);
  --out:cubic-bezier(.55,.06,.68,.19);
  --pop:cubic-bezier(.3,1.35,.5,1);
}
html,body{margin:0;height:100%;background:#F2F4F7;overflow:hidden;cursor:pointer;
  -webkit-user-select:none;user-select:none}
svg{display:block;width:100vw;height:100vh}
text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
.mono{font-family:"Consolas","SF Mono",Menlo,monospace}
.serif{font-family:Georgia,"Cambria","Times New Roman",serif}

/* Los grupos grandes se promueven a su propia capa: la grabación de pantalla
   necesita 60 fps estables. */
.sheet,.pyblock,.wbook,.resumen,.params,.xcard,.chklist{will-change:transform,opacity}

/* ── Motor de estados: pre (sin clase) → .in → .out ───────────────────────── */

.sheet{opacity:0;transform:translateY(26px) scale(.985);transform-origin:620px 450px;
  transition:opacity var(--t-mid) ease, transform var(--t-slow) var(--in)}
.sheet.in{opacity:1;transform:none}
.sheet.out{opacity:0;transform:translate(-400px,-15px) scale(.29);
  transition:opacity var(--t-slow) var(--out), transform var(--t-slow) var(--out)}
.sheet.dim:not(.out){opacity:.4}

.row{opacity:0;transform:translateX(-34px);
  transition:opacity var(--t-fast) ease, transform 420ms var(--in)}
.row.in{opacity:1;transform:none}
/* La fila repetida no se desvanece sin más: se va hacia fuera de la tabla,
   que es exactamente lo que le hace drop_duplicates. */
.row.out{opacity:0;transform:translateX(64px);
  transition:opacity var(--t-mid) ease, transform var(--t-mid) var(--out)}

.sfoot{opacity:0;transition:opacity var(--t-mid) ease}
.sfoot.in{opacity:1}

.hook,.hookline,.hook2{opacity:0;transform:translateY(16px);
  transition:opacity var(--t-mid) ease, transform var(--t-mid) var(--in)}
.hook.in,.hookline.in,.hook2.in{opacity:1;transform:none}
.hook.out,.hookline.out,.hook2.out{opacity:0;transform:translateY(-12px);
  transition-duration:var(--t-fast)}
.strike{transform:none;stroke-dasharray:100;stroke-dashoffset:100;
  transition:stroke-dashoffset var(--t-mid) var(--in), opacity var(--t-fast) ease}
.strike.in{stroke-dashoffset:0}

.xcard,.pyblock,.wbook,.chklist,.chkline,.params,.pline,.resumen,.kpi,.livepill{
  opacity:0;transform:translateY(16px);
  transition:opacity var(--t-mid) ease, transform var(--t-mid) var(--in)}
.xcard.in,.pyblock.in,.wbook.in,.chklist.in,.chkline.in,.params.in,.pline.in,
.resumen.in,.kpi.in,.livepill.in{opacity:1;transform:none}
.xcard.out,.pyblock.out,.wbook.out,.chklist.out,.chkline.out,.params.out,.pline.out,
.resumen.out,.kpi.out,.livepill.out{opacity:0;transform:translateY(-12px);
  transition-duration:var(--t-fast)}

/* Celda sucia → celda limpia. Mismo par que los marcadores {{campo}} del
   informe en Word: el valor crudo nace visible y solo tiene salida. */
.ph,.oldval{opacity:1;transition:opacity var(--t-fast) ease}
.ph.out,.oldval.out{opacity:0}
.val,.newval{opacity:0;transition:opacity var(--t-mid) ease}
.val.in,.newval.in{opacity:1}
.flashrect{opacity:0}
.flash .flashrect{animation:flashOut 1100ms ease both}
@keyframes flashOut{0%{opacity:0}16%{opacity:1}100%{opacity:0}}

.cl,.stagelbl,.tab,.rbar{opacity:0;transform:translateX(-16px);
  transition:opacity var(--t-fast) ease, transform 300ms var(--in)}
.cl.in,.stagelbl.in,.tab.in,.rbar.in{opacity:1;transform:none}
.stagelbl{transform:translateY(12px)}
/* Las barras del gráfico crecen desde su base, no aparecen ya dibujadas. */
.rbar{transform:scaleY(0);transform-origin:0 700px;
  transition:opacity var(--t-fast) ease, transform 560ms var(--pop)}
.rbar.in{transform:none}

/* Cabecera: entra bajando desde arriba y se retira en el cierre para no
   competir con el titular grande. */
.ptitle{opacity:0;transform:translateY(-12px);
  transition:opacity var(--t-slow) ease, transform var(--t-slow) var(--in)}
.ptitle.in{opacity:1;transform:none}
.ptitle.out{opacity:0;transform:translateY(-12px);transition-duration:var(--t-mid)}
.ptrule{stroke-dasharray:100;stroke-dashoffset:100;
  transition:stroke-dashoffset var(--t-slow) var(--in), opacity var(--t-mid) ease}
.ptrule.in{stroke-dashoffset:0}

.logo{opacity:0;transform:translateY(10px);
  transition:opacity var(--t-mid) ease, transform var(--t-mid) var(--in)}
.logo.in{opacity:1;transform:none}
.logo.out{opacity:0;transform:translateY(-10px);transition-duration:var(--t-fast)}

.runui,.wcounter{opacity:0;transition:opacity var(--t-fast) ease}
.runui.in,.wcounter.in{opacity:1}
.runui.out,.wcounter.out{opacity:0}
/* scaleX en vez de animar `width`: se compone en GPU. */
.prog{transform:scaleX(0);transform-origin:492px 588px;
  transition:transform 2400ms cubic-bezier(.35,.05,.25,1)}
.prog.in{transform:scaleX(1)}
#wcount{transform-origin:1290px 612px;transition:transform 340ms var(--pop)}
#wcount.pop{transform:scale(1.1)}
.chkmark{opacity:0;transition:opacity var(--t-fast) ease}
.chkmark.on{opacity:1}

.flow{opacity:0;transition:opacity var(--t-fast) ease}
.flow.in{opacity:1}
.flow.out{opacity:0}
.pa{animation:laneA 1.5s linear infinite}
@keyframes laneA{0%{transform:translateX(0);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(58px);opacity:0}}
.pb{animation:laneB 1.6s linear infinite}
@keyframes laneB{0%{transform:translateX(0);opacity:0}18%{opacity:1}82%{opacity:1}100%{transform:translateX(38px);opacity:0}}

.otitle,.osub,.brand{opacity:0;transform:translateY(22px);
  transition:opacity var(--t-slow) ease, transform var(--t-slow) var(--in)}
.otitle.in,.osub.in,.brand.in{opacity:1;transform:none}

/* ── HUD: se puede ocultar con H o ?hud=0 para que no quede en la grabación ─ */
.dot{fill:#7C8AA0;opacity:.16;transition:opacity var(--t-fast) ease, fill var(--t-fast) ease}
.dot.done{opacity:.30}
.dot.on{fill:#1E7B4D;opacity:.60}
#hint{opacity:0;transition:opacity var(--t-mid) ease}
#hint.show{opacity:1}

#fsexit{position:fixed;top:18px;right:18px;z-index:10;opacity:0;pointer-events:none;
  transition:opacity .3s ease;
  font:600 14px/1 "Segoe UI",system-ui,-apple-system,sans-serif;color:#fff;
  background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:11px 18px;cursor:pointer}
#fsexit:hover{background:rgba(15,23,42,.95)}
.isfs.fsui #fsexit{opacity:1;pointer-events:auto}

/* Vuelta al índice de ejercicios. Se va con el HUD (H o ?hud=0) y en pantalla
   completa, para que tampoco quede en la grabación. */
#home{position:fixed;top:18px;left:18px;z-index:10;opacity:.6;
  transition:opacity .3s ease, background .3s ease;
  font:600 14px/1 "Segoe UI",system-ui,-apple-system,sans-serif;color:#334155;
  background:rgba(255,255,255,.72);border:1px solid rgba(15,23,42,.14);
  border-radius:999px;padding:11px 18px;cursor:pointer;text-decoration:none}
#home:hover,#home:focus-visible{opacity:1;background:#fff}
.isfs #home{display:none}

/* Salto instantáneo al reiniciar */
.instant *{transition-duration:0s !important;transition-delay:0s !important}
</style>
</head>

    <text x="1234" y="718">Financ.</text>
    <text x="1326" y="718">T. Hum.</text>
    <text x="1418" y="718">TI</text>
  </g>
</g>

<!-- ═══ CIERRE ═════════════════════════════════════════════════════════════ -->
<text class="otitle" x="800" y="706" font-size="72" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-1.8">Un informe que se recalcula solo</text>
<text class="osub" x="800" y="760" font-size="30" fill="#5A6472" text-anchor="middle">seis hojas, fórmulas vivas, cero copiar y pegar</text>
<text class="mono brand" x="800" y="818" font-size="20" fill="#94A3B8" text-anchor="middle" letter-spacing="4">TRABAJO CIENTÍFICO</text>

<g id="hud"></g>
<text class="mono" id="hint" x="44" y="862" font-size="17" fill="#B7C0CA">clic o → para avanzar · I vuelve al inicio · H oculta esta guía</text>
</svg>

<a id="home" href="index.html">← Inicio</a>
<button id="fsexit" type="button">✕ salir de pantalla completa</button>

<script>
(function(){
"use strict";

/* Cada paso declara qué entra y qué sale. El avance es por clic: no hay reloj
   global, así que se puede ir hacia atrás y el estado se recompone solo.

   El arco va del desorden al informe vivo: primero se ve la mugre (pasos 0-3),
   luego se limpia a la vista (paso 4), después se construye el libro (5-6) y
   solo al final se demuestra lo que de verdad distingue a este ejercicio:
   cambiar un supuesto recalcula todo sin volver a ejecutar nada (pasos 7-8). */
var STEPS = [
  { enter:['.ptitle','.ptrule','.sheet','.logoXlSheet'] },                        // 0 · la hoja
  { enter:['.row','.sfoot'] },                                                    // 1 · las filas sucias
  { enter:['.hook','.hookline'] },                                                // 2 · ≈ 2 días
  { enter:['.hook2'] },                                                           // 3 · 8 segundos
  { enter:['.chklist','.chkline','.val'],
    exit:['.hook','.hookline','.hook2','.ph','.dupe'] },                          // 4 · la depuración
  { enter:['.xcard','.pyblock','.cl','.stagelbl','.flow','.wbook','.logoXlBook'],
    exit:['.sheet','.logoXlSheet','.chklist','.chkline'] },                       // 5 · el script
  { enter:['.runui','.prog','.tab','.wcounter'] },                                // 6 · seis hojas
  { enter:['.params','.pline','.resumen','.kpi','.rbar'],
    exit:['.xcard','.pyblock','.cl','.stagelbl','.flow','.wbook','.tab','.runui',
          '.wcounter','.logoXlBook'] },                                           // 7 · el resumen
  { enter:['.newval','.livepill'], exit:['.oldval'] },                            // 8 · el Excel vivo
  { enter:['.otitle'],
    exit:['.params','.pline','.resumen','.kpi','.rbar','.newval','.livepill',
          '.ptitle','.ptrule'] },                                                 // 9 · el resultado
  { enter:['.osub','.brand'] }                                                    // 10 · cierre
];
var RUN_AT  = 6;   // paso que dispara el contador de hojas
var KPI_AT  = 7;   // paso en el que los indicadores suben desde cero
var LIVE_AT = 8;   // paso en el que cambia el supuesto y todo se recalcula

/* ── Preparación ──────────────────────────────────────────────────────────── */
var plan = new Map();   // elemento → {inAt, outAt}
function mark(sel, i, key){
  document.querySelectorAll(sel).forEach(function(el){
    var rec = plan.get(el) || {};
    if(rec[key] === undefined) rec[key] = i;
    plan.set(el, rec);
  });
}
STEPS.forEach(function(s, i){
  (s.enter||[]).forEach(function(sel){ mark(sel, i, 'inAt'); });
  (s.exit ||[]).forEach(function(sel){ mark(sel, i, 'outAt'); });
});
// Las celdas sucias y los supuestos viejos nacen visibles: solo tienen salida.
document.querySelectorAll('.ph').forEach(function(el){
  var rec = plan.get(el) || {}; rec.inAt = 0; plan.set(el, rec);
});
document.querySelectorAll('.oldval').forEach(function(el){
  var rec = plan.get(el) || {}; rec.inAt = 7; plan.set(el, rec);
});

/* `desde` retrasa el escalonado completo. Se usa cuando lo que entra ocupa el
   mismo sitio que lo que acaba de salir: si no, las dos tarjetas se cruzan a
   media opacidad y por un momento no se lee ninguna. */
function stagger(sel, step, desde){
  var d0 = desde || 0;
  document.querySelectorAll(sel).forEach(function(el, i){ el.dataset.delay = (d0 + i*step).toFixed(3); });
}
function fixedDelay(sel, d){
  document.querySelectorAll(sel).forEach(function(el){ el.dataset.delay = d; });
}
stagger('.row',     .065);
stagger('.cl',      .085);
stagger('.hookline',.13);
stagger('.hook2',   .18);
stagger('.chkline', .075, .34);   // entra cuando la tarjeta roja ya se fue
stagger('.stagelbl',.1);
stagger('.tab',     .26);   // acompaña al contador de hojas: 6 × .26 ≈ 1,6 s
stagger('.kpi',     .11);
stagger('.rbar',    .06);
stagger('.pline',   .07);
fixedDelay('.ptrule',  .35);   // la línea se dibuja cuando el título ya entró
fixedDelay('.chklist', .3);
fixedDelay('.pyblock', .12);
fixedDelay('.wbook',   .2);
fixedDelay('.resumen', .12);
fixedDelay('.livepill',.45);   // el sello llega después de que las cifras cambian

/* Origen de escala de cada barra, calculado desde su propia x */
document.querySelectorAll('.rbar').forEach(function(b){
  b.style.transformOrigin = (+b.getAttribute('x') + 32) + 'px 700px';
});

/* Puntos de progreso del HUD */
var hud = document.getElementById('hud');
var hint = document.getElementById('hint');
var SVGNS = 'http://www.w3.org/2000/svg';
var dots = STEPS.map(function(_, i){
  var c = document.createElementNS(SVGNS,'circle');
  c.setAttribute('cx', 1347 + i*13);
  c.setAttribute('cy', 862);
  c.setAttribute('r', 2.5);
  c.setAttribute('class','dot');
  hud.appendChild(c);
  return c;
});

var hudOn = new URLSearchParams(location.search).get('hud') !== '0';
function applyHud(){
  hud.style.display = hudOn ? '' : 'none';
  document.getElementById('home').style.display = hudOn ? '' : 'none';
  updateHint();
}
applyHud();

/* ── Cifras animadas ──────────────────────────────────────────────────────── */
/* Separador de miles a la colombiana, escrito a mano: toLocaleString cambia de
   comportamiento entre navegadores y aquí el formato tiene que ser exacto. */
function miles(n){
  var s = String(Math.round(Math.abs(n))), out = '', c = 0;
  for(var i = s.length - 1; i >= 0; i--){
    out = s.charAt(i) + out;
    if(++c % 3 === 0 && i > 0) out = '.' + out;
  }
  return (n < 0 ? '−' : '') + out;
}
var FMT = {
  planta: function(v){ return miles(v); },
  rot:    function(v){ return v.toFixed(1).replace('.', ',') + ' %'; },
  costo:  function(v){ return '$ ' + miles(v) + ' MM'; },
  sal:    function(v){ return '$ ' + miles(v); },
  min:    function(v){ return miles(v); }
};
var kpiPlanta = document.getElementById('kpiPlanta');
var kpiRot    = document.getElementById('kpiRot');
var kpiCosto  = document.getElementById('kpiCosto');
var kpiSal    = document.getElementById('kpiSal');
var kpiMin    = document.getElementById('kpiMin');

// Cifras reales de datos_tiendita.xlsx una vez depurado (260 registros).
var BASE = { planta:218, rot:16.2, costo:17752, sal:4152000, min:4 };
var VIVO = { costo:18483, min:17 };   // con el factor en 1,5890 y el SMMLV en 1.623.000

var rafs = [];
function animar(el, desde, hasta, fmt, dur){
  var t0 = performance.now(), h = {id:0};
  rafs.push(h);
  (function tick(now){
    var p = Math.min(1, (now - t0) / dur);
    var e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
    el.textContent = fmt(desde + (hasta - desde) * e);
    if(p < 1) h.id = requestAnimationFrame(tick);
  })(t0);
}
function pararCifras(){
  rafs.forEach(function(h){ cancelAnimationFrame(h.id); });
  rafs = [];
}
function contarKPIs(){
  pararCifras();
  animar(kpiPlanta, 0, BASE.planta, FMT.planta, 1500);
  animar(kpiRot,    0, BASE.rot,    FMT.rot,    1500);
  animar(kpiCosto,  0, BASE.costo,  FMT.costo,  1700);
  animar(kpiSal,    0, BASE.sal,    FMT.sal,    1700);
  animar(kpiMin,    0, BASE.min,    FMT.min,    1500);
}
function recalcular(){
  pararCifras();
  animar(kpiCosto, BASE.costo, VIVO.costo, FMT.costo, 1200);
  animar(kpiMin,   BASE.min,   VIVO.min,   FMT.min,   1200);
}
function kpisEnBase(){
  pararCifras();
  kpiPlanta.textContent = FMT.planta(BASE.planta);
  kpiRot.textContent    = FMT.rot(BASE.rot);
  kpiCosto.textContent  = FMT.costo(BASE.costo);
  kpiSal.textContent    = FMT.sal(BASE.sal);
  kpiMin.textContent    = FMT.min(BASE.min);
}
function kpisEnCero(){
  pararCifras();
  kpiPlanta.textContent = FMT.planta(0);
  kpiRot.textContent    = FMT.rot(0);
  kpiCosto.textContent  = FMT.costo(0);
  kpiSal.textContent    = FMT.sal(0);
  kpiMin.textContent    = FMT.min(0);
}

/* ── Contador de hojas ────────────────────────────────────────────────────── */
var wcount   = document.getElementById('wcount');
var runlabel = document.getElementById('runlabel');
var chkmark  = document.querySelector('.chkmark');
var hojasRAF = null, popTO = null;

function runHojas(){
  cancelAnimationFrame(hojasRAF);
  clearTimeout(popTO);
  var dur = 2000, t0 = performance.now();
  runlabel.textContent = 'construyendo el libro…';
  wcount.setAttribute('fill','#0F172A');
  chkmark.classList.remove('on');
  (function tick(now){
    var p = Math.min(1, (now - t0) / dur);
    var e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
    wcount.textContent = Math.round(e*6) + ' / 6 hojas';
    if(p < 1){ hojasRAF = requestAnimationFrame(tick); return; }
    wcount.setAttribute('fill','#1E7B4D');
    runlabel.textContent = 'libro generado · 8 s';
    chkmark.classList.add('on');
    wcount.classList.add('pop');
    popTO = setTimeout(function(){ wcount.classList.remove('pop'); }, 340);
  })(t0);
}
function resetHojas(){
  cancelAnimationFrame(hojasRAF);
  clearTimeout(popTO);
  wcount.textContent = '0 / 6 hojas';
  wcount.setAttribute('fill','#0F172A');
  wcount.classList.remove('pop');
  chkmark.classList.remove('on');
  runlabel.textContent = 'construyendo el libro…';
}

/* ── Render ───────────────────────────────────────────────────────────────── */
var beat = -1;
var sheet = document.querySelector('.sheet');
// El destello vive en la raíz del SVG: en el paso 8 tienen que encenderse a la
// vez la celda del supuesto (izquierda) y las cifras que dependen de ella.
var stage = document.getElementById('stage');

function render(){
  plan.forEach(function(rec, el){
    var state = 'pre';
    if(rec.outAt !== undefined && beat >= rec.outAt) state = 'out';
    else if(rec.inAt !== undefined && beat >= rec.inAt) state = 'in';
    el.classList.toggle('in',  state === 'in');
    el.classList.toggle('out', state === 'out');
    // El escalonado solo cuenta al entrar; al retroceder todo se va a la vez.
    el.style.transitionDelay = (state === 'in' && el.dataset.delay) ? el.dataset.delay+'s' : '0s';
  });

  sheet.classList.toggle('dim', beat === 2 || beat === 3);
  // El destello verde marca exactamente lo que cambió al tocar el supuesto.
  stage.classList.toggle('flash', beat === LIVE_AT);

  dots.forEach(function(d, i){
    d.classList.toggle('on', i === beat);
    d.classList.toggle('done', i < beat);
  });

  updateHint();
}

function goTo(n){
  n = Math.max(0, Math.min(STEPS.length - 1, n));
  if(n === beat) return;
  var prev = beat;
  beat = n;

  if(beat >= RUN_AT && prev <  RUN_AT) runHojas();
  if(beat <  RUN_AT && prev >= RUN_AT) resetHojas();

  // Las cifras tienen tres estados: en cero, en la base y recalculadas. Al
  // retroceder hay que devolverlas al que corresponde, no solo detenerlas.
  if(beat >= LIVE_AT && prev <  LIVE_AT)      recalcular();
  else if(beat <  LIVE_AT && prev >= LIVE_AT) kpisEnBase();
  else if(beat >= KPI_AT && prev <  KPI_AT)   contarKPIs();
  else if(beat <  KPI_AT && prev >= KPI_AT)   kpisEnCero();

  render();
}

var next = function(){ goTo(beat + 1); };
var prev = function(){ goTo(beat - 1); };

/* Fuerza al navegador a recalcular estilos ahora mismo. Sin esto, pasar de
   'pre' a '.in' en el mismo frame no dispara ninguna transición. */
function flush(){ void document.body.offsetHeight; }

function reset(){
  var root = document.documentElement;
  root.classList.add('instant');
  resetHojas();
  kpisEnCero();
  beat = -1;
  render();
  flush();
  root.classList.remove('instant');
  flush();
}

/* ── Pantalla completa ────────────────────────────────────────────────────── */
function fsElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}
function exitFs(){
  var fn = document.exitFullscreen || document.webkitExitFullscreen;
  if(!fn) return;
  try { var p = fn.call(document); if(p && p.catch) p.catch(function(){}); } catch(err){}
}
function enterFs(){
  var el = document.documentElement;
  var fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!fn) return;
  try {
    var p = fn.call(el);
    if(p && p.catch) p.catch(function(){});
  } catch(err){}
}
function toggleFs(){ if(fsElement()) exitFs(); else enterFs(); }

var fsBtn = document.getElementById('fsexit');
fsBtn.addEventListener('click', function(e){
  e.stopPropagation();   // sale de pantalla completa; no avanza la animación
  exitFs();
});

var uiTO = null;
function showFsUi(){
  if(!fsElement()) return;
  document.documentElement.classList.add('fsui');
  clearTimeout(uiTO);
  uiTO = setTimeout(function(){ document.documentElement.classList.remove('fsui'); }, 2600);
}
window.addEventListener('mousemove', showFsUi);

document.addEventListener('fullscreenchange', updateHint);
document.addEventListener('webkitfullscreenchange', updateHint);

function updateHint(){
  var fs = !!fsElement();
  document.documentElement.classList.toggle('isfs', fs);
  if(fs) showFsUi();

  hint.style.display = hudOn ? '' : 'none';
  if(fs){
    hint.textContent = 'F, Esc o el botón para salir de pantalla completa';
    hint.classList.add('show');
    return;
  }

  if(beat <= 0)                      { hint.textContent = 'clic o → para avanzar · I vuelve al inicio · H oculta esta guía'; hint.classList.add('show'); }
  else if(beat === STEPS.length - 1) { hint.textContent = 'R para reiniciar'; hint.classList.add('show'); }
  else                               { hint.classList.remove('show'); }
}

/* ── Controles ────────────────────────────────────────────────────────────── */
document.getElementById('home').addEventListener('click', function(e){
  e.stopPropagation();   // vuelve al índice; no avanza la animación
});
window.addEventListener('click', next);
window.addEventListener('contextmenu', function(e){ e.preventDefault(); prev(); });

window.addEventListener('keydown', function(e){
  var k = e.key;
  if(k === ' ' || k === 'Enter' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown'){
    e.preventDefault(); next();
  } else if(k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace'){
    e.preventDefault(); prev();
  } else if(k === 'Home' || k === 'r' || k === 'R'){
    e.preventDefault(); reset();
  } else if(k === 'h' || k === 'H'){
    e.preventDefault(); hudOn = !hudOn; applyHud();
  } else if(k === 'Escape'){
    exitFs();
  } else if((k === 'i' || k === 'I') && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault(); location.href = 'index.html';
  } else if(k === 'f' || k === 'F'){
    e.preventDefault(); toggleFs();
  }
}, true);   // fase de captura: nuestro manejador es el primero de la cadena

/* Arranca en el lienzo vacío (beat -1): el primer clic trae la primera tarjeta. */
kpisEnCero();
render();
flush();
})();
</script>
</body>
</html>
